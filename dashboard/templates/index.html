<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Room Intelligence</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
        }
        .card h2 {
            color: #00ff88;
            margin-bottom: 15px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .camera-feed {
            grid-column: 1 / -1;
        }
        .camera-feed img {
            width: 100%;
            border-radius: 8px;
        }
        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .sensor-item {
            background: #222;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .sensor-value {
            font-size: 32px;
            font-weight: bold;
            color: #00ff88;
        }
        .sensor-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        .motion-yes { color: #ff4444 !important; }
        .motion-no  { color: #00ff88 !important; }
        .alert-log {
            grid-column: 1 / -1;
        }
        .alert-item {
            background: #222;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 13px;
            border-left: 3px solid #ff4444;
            color: #ccc;
        }
        .no-alerts {
            color: #555;
            text-align: center;
            padding: 20px;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        .links {
            text-align: center;
            margin-bottom: 20px;
        }
        .links a {
            color: #00ff88;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
            border: 1px solid #00ff88;
            padding: 6px 16px;
            border-radius: 20px;
        }
        .links a:hover { background: #00ff8822; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <h1>🏠 Smart Room Intelligence</h1>

    <div class="links">
        <a href="http://192.168.1.101:3000" target="_blank">📊 Grafana Dashboard</a>
        <a href="http://192.168.1.101:8086" target="_blank">🗄️ InfluxDB</a>
    </div>

    <div class="grid">

        <!-- Camera Feed -->
        <div class="card camera-feed">
            <h2><span class="status-dot"></span>Live Camera Feed</h2>
            <img src="/video_feed" alt="Live camera feed">
        </div>

        <!-- Sensor Readings -->
        <div class="card">
            <h2>Sensor Readings</h2>
            <div class="sensor-grid">
                <div class="sensor-item">
                    <div class="sensor-value" id="temperature">--</div>
                    <div class="sensor-label">Temperature °C</div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-value" id="humidity">--</div>
                    <div class="sensor-label">Humidity %</div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-value" id="distance">--</div>
                    <div class="sensor-label">Distance cm</div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-value" id="motion">--</div>
                    <div class="sensor-label">Motion</div>
                </div>
            </div>
        </div>

        <!-- System Status -->
        <div class="card">
            <h2>System Status</h2>
            <div class="sensor-grid">
                <div class="sensor-item">
                    <div class="sensor-value" 
                         style="font-size:16px;color:#00ff88">ARMED</div>
                    <div class="sensor-label">System</div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-value" 
                         style="font-size:16px;color:#00ff88">ONLINE</div>
                    <div class="sensor-label">MQTT</div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-value" 
                         style="font-size:16px;color:#00ff88">ONLINE</div>
                    <div class="sensor-label">InfluxDB</div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-value" 
                         style="font-size:16px;color:#00ff88">ONLINE</div>
                    <div class="sensor-label">Grafana</div>
                </div>
            </div>
        </div>

        <!-- Alert Log -->
        <div class="card alert-log">
            <h2>Recent Alerts</h2>
            <div id="alerts">
                <div class="no-alerts">No alerts yet</div>
            </div>
        </div>

    </div>

    <script>
        // Poll sensors every 2 seconds
        function updateSensors() {
            fetch("/sensors")
                .then(r => r.json())
                .then(data => {
                    document.getElementById("temperature").textContent =
                        data.temperature ? 
                        data.temperature.toFixed(1) : "--";
                    document.getElementById("humidity").textContent =
                        data.humidity ? 
                        data.humidity.toFixed(1) : "--";
                    document.getElementById("distance").textContent =
                        data.distance ? 
                        data.distance.toFixed(0) : "--";

                    const motionEl = document.getElementById("motion");
                    if (data.motion) {
                        motionEl.textContent = "YES";
                        motionEl.className = "sensor-value motion-yes";
                    } else {
                        motionEl.textContent = "NO";
                        motionEl.className = "sensor-value motion-no";
                    }
                })
                .catch(err => console.log("Sensor error:", err));
        }

        // Load alerts every 10 seconds
        function loadAlerts() {
            fetch("/alerts")
                .then(r => r.json())
                .then(alerts => {
                    const div = document.getElementById("alerts");
                    if (alerts.length === 0) {
                        div.innerHTML = 
                            "<div class='no-alerts'>No alerts yet</div>";
                        return;
                    }
                    div.innerHTML = alerts.reverse().map(a =>
                        `<div class='alert-item'>${a}</div>`
                    ).join("");
                });
        }

        // Start polling
        updateSensors();
        setInterval(updateSensors, 2000);
        loadAlerts();
        setInterval(loadAlerts, 10000);
    </script>
</body>
</html>
